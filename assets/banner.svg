<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="340" viewBox="0 0 1200 340" style="background:linear-gradient(135deg,#0d1117 0,#161b22 50%,#0f172a 100%);border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bgGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".15"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".1"/><stop offset="100%" stop-color="#c084fc" stop-opacity=".18"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="35%" stop-color="#818cf8"/><stop offset="70%" stop-color="#c084fc"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="badgeGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".9"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1) translate(0,0)}50%{opacity:.65;transform:scale(1.08) translate(15px,-10px)}}@keyframes floatOrb1{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-20px) translateX(25px)}}@keyframes floatOrb2{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(22px) translateX(-20px)}}@keyframes flowLine{0%{stroke-dashoffset:400}}@keyframes pillHover1{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes pillHover2{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pillHover3{0%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes pillHover4{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}.orb-1,.orb-2{animation:floatOrb1 9s ease-in-out infinite,pulseGlow 6s ease-in-out infinite;transform-origin:center}.orb-2{animation:floatOrb2 11s ease-in-out infinite,pulseGlow 8s ease-in-out infinite}.flow-dash{stroke-dasharray:12 14;animation:flowLine 15s linear infinite}.pill-1{animation:pillHover1 5s ease-in-out infinite}.pill-2{animation:pillHover2 6s ease-in-out infinite .8s}.pill-3{animation:pillHover3 5.5s ease-in-out infinite 1.6s}.pill-4{animation:pillHover4 6.2s ease-in-out infinite 2.2s}</style><rect width="100%" height="100%" fill="#090d16"/><rect width="100%" height="100%" fill="url(#bgGlow)"/><circle cx="180" cy="80" r="140" fill="#38bdf8" class="orb-1" filter="url(#glow)" opacity=".22"/><circle cx="1040" cy="220" r="160" fill="#a855f7" class="orb-2" filter="url(#glow)" opacity=".25"/><circle cx="720" cy="50" r="110" fill="#ec4899" class="orb-1" filter="url(#glow)" opacity=".14"/><g opacity=".35"><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 50 70 L 350 70 L 420 130 L 780 130 L 860 60 L 1150 60" class="flow-dash"/><path fill="none" stroke="#a855f7" stroke-width="1.5" d="M 80 270 L 280 270 L 360 210 L 820 210 L 910 270 L 1120 270" class="flow-dash"/><circle cx="420" cy="130" r="3.5" fill="#38bdf8"/><circle cx="780" cy="130" r="3.5" fill="#818cf8"/><circle cx="360" cy="210" r="3.5" fill="#a855f7"/><circle cx="820" cy="210" r="3.5" fill="#f472b6"/></g><g class="pill-1" transform="translate(110, 45)"><rect width="170" height="34" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1.2" rx="17"/><circle cx="20" cy="17" r="5" fill="#38bdf8"/><text x="34" y="22" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing=".4">📧 Unified Mail &amp; Cal</text></g><g class="pill-2" transform="translate(900, 45)"><rect width="190" height="34" fill="url(#badgeGrad)" stroke="#a855f7" stroke-opacity=".5" stroke-width="1.2" rx="17"/><circle cx="20" cy="17" r="5" fill="#a855f7"/><text x="34" y="22" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing=".4">🔐 Zero-Trust Sovereignty</text></g><g class="pill-3" transform="translate(85, 260)"><rect width="190" height="34" fill="url(#badgeGrad)" stroke="#818cf8" stroke-opacity=".5" stroke-width="1.2" rx="17"/><circle cx="20" cy="17" r="5" fill="#818cf8"/><text x="34" y="22" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing=".4">⚡ Real-Time Co-Authoring</text></g><g class="pill-4" transform="translate(905, 260)"><rect width="180" height="34" fill="url(#badgeGrad)" stroke="#f472b6" stroke-opacity=".5" stroke-width="1.2" rx="17"/><circle cx="20" cy="17" r="5" fill="#f472b6"/><text x="34" y="22" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing=".4">🚀 Enterprise SaaS &amp; FOSS</text></g><rect width="760" height="142" x="220" y="98" fill="#090d16" fill-opacity=".65" stroke="#334155" stroke-opacity=".4" stroke-width="1" rx="20"/><g text-anchor="middle"><text x="600" y="132" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="2.5">✨ CURATED PRODUCTION DIRECTORY ✨</text><text x="600" y="180" fill="url(#textGrad)" font-size="34" font-weight="900" letter-spacing="-.5">Team Collaboration &amp; Groupware Suite</text><text x="600" y="214" fill="#94a3b8" font-size="15" font-weight="400" letter-spacing=".2">Self-Hosted Open Source Hubs • Modern SaaS Platforms • Sovereign Workspaces</text></g></svg>